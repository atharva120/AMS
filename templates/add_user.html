<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add User</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Helvetica, sans-serif;
}

body {
  background-color: #1A2526;
  color: #fff;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  font-size: 1.8rem;
  font-weight: 500;
  color: #fff;
  text-align: center;
  margin-bottom: 20px;
}

.card {
  background-color: #2C3E50;
  border-radius: 10px;
  padding: 20px;
  margin: 20px 0;
  max-width: 600px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

form {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

label {
  color: #fff;
  font-size: 1rem;
  margin-bottom: 10px;
}

input[type="text"] {
  padding: 8px;
  margin-bottom: 20px;
  background-color: #3A4B5C;
  border: none;
  border-radius: 5px;
  color: white;
  font-size: 1rem;
  width: 100%;
}

input::placeholder {
  color: #A0A0A0;
}

input[type="text"]:focus {
  outline: none;
  border: 1px solid #28A745;
  box-shadow: 0 0 5px rgba(40, 167, 69, 0.5);
}

button {
  background-color: #6C757D;
  color: white;
  padding: 8px 16px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1rem;
  margin: 10px;
}

button:hover {
  background-color: #5A6268;
}

button:active {
  transform: scale(0.96);
}

button:disabled {
  background-color: #666;
  cursor: not-allowed;
}

.back-btn {
  background-color: #28A745;
  margin-top: 20px;
}

.back-btn:hover {
  background-color: #218838;
}

.error-message {
  background-color: #DC3545;
  color: white;
  padding: 10px;
  border-radius: 5px;
  margin-bottom: 20px;
  text-align: center;
  font-weight: bold;
  width: 100%;
}

a {
  text-decoration: none;
}

video {
  max-width: 100%;
  border-radius: 10px;
  margin-bottom: 20px;
  display: none;
}

canvas {
  display: none;
}

#loading {
  display: none;
  color: #28A745;
  font-size: 1.1rem;
  margin-top: 10px;
}

#error {
  color: #DC3545;
  font-size: 1rem;
  margin-top: 10px;
  display: none;
}

#capture-status {
  color: #A0A0A0;
  font-size: 1rem;
  margin-bottom: 20px;
}

.action-btn {
  background-color: #6C757D;
  padding: 12px 24px;
  font-size: 1.1rem;
}

.action-btn:hover {
  background-color: #5A6268;
}
  </style>
</head>
<body>
  <h1>Add New User</h1>
  <div class="card">
    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}
    <form id="add-user-form">
      <label for="name">Enter Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter user's name" required>
      <video id="video" autoplay></video>
      <canvas id="canvas"></canvas>
      <p id="capture-status">Captured 0/20 images</p>
      <button type="button" id="capture-btn" class="action-btn">Capture & Register</button>
      <p id="loading">Processing...</p>
      <p id="error"></p>
    </form>
    <a href="/admin_panel"><button class="back-btn">Back to Admin Panel</button></a>
  </div>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('capture-btn');
    const form = document.getElementById('add-user-form');
    const nameInput = document.getElementById('name');
    const captureStatus = document.getElementById('capture-status');
    const loadingP = document.getElementById('loading');
    const errorP = document.getElementById('error');

    let imageCount = 0;
    const maxImages = 20;
    let images = [];

    // Access webcam
    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.style.display = 'block';
      } catch (err) {
        errorP.textContent = "Error accessing webcam. Please allow camera access and ensure you're using HTTPS.";
        errorP.style.display = 'block';
        captureBtn.disabled = true;
        console.error("Webcam error:", err);
      }
    }

    // Capture images
    async function captureImages() {
      if (!video.srcObject) {
        await startWebcam();
        await new Promise(resolve => setTimeout(resolve, 1000)); // Wait for stream
      }

      if (video.srcObject && imageCount < maxImages) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const imageData = canvas.toDataURL('image/jpeg', 0.8);
        images.push(imageData);
        imageCount++;
        captureStatus.textContent = `Captured ${imageCount}/${maxImages} images`;
        return true;
      }
      return false;
    }

    // Capture button handler
    captureBtn.addEventListener('click', async () => {
      if (!nameInput.value.trim()) {
        errorP.textContent = "Please enter a name.";
        errorP.style.display = 'block';
        return;
      }

      captureBtn.disabled = true;
      loadingP.style.display = 'block';
      errorP.style.display = 'none';
      captureStatus.textContent = `Captured ${imageCount}/${maxImages} images`;

      // Capture up to 20 images
      while (imageCount < maxImages) {
        const captured = await captureImages();
        if (!captured) break;
        await new Promise(resolve => setTimeout(resolve, 500)); // Delay between captures
      }

      // Send images to server
      try {
        const response = await fetch('/add_user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: nameInput.value, images: images })
        });

        if (!response.ok) {
          const result = await response.json();
          errorP.textContent = result.error || "Error registering user.";
          errorP.style.display = 'block';
        } else {
          // Redirect to admin panel on success
          window.location.href = '/admin_panel';
        }
      } catch (err) {
        errorP.textContent = "Error processing images. Please try again.";
        errorP.style.display = 'block';
        console.error("Capture error:", err);
      } finally {
        captureBtn.disabled = false;
        loadingP.style.display = 'none';
      }
    });

    // Start webcam on page load
    startWebcam();

    // Stop webcam when leaving page
    window.addEventListener('beforeunload', () => {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>
</html>
