<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login</title>
    <style>
        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Helvetica, sans-serif;
}

body {
  background-color: #1A2526;
  color: #fff;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  background-color: #2C3E50;
  border-radius: 10px;
  padding: 20px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  position: relative; /* Ensure no overlap issues */
}

h1 {
  font-size: 1.8rem;
  font-weight: 500;
  color: #fff;
  margin-bottom: 20px;
}

form {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

label {
  color: #fff;
  font-size: 1rem;
  margin-bottom: 5px; /* Reduced to avoid excessive spacing */
  width: 100%;
  text-align: left;
}

input[type="text"],
input[type="password"] {
  padding: 8px;
  margin-bottom: 20px;
  background-color: #3A4B5C;
  border: 1px solid transparent; /* Ensure border is defined */
  border-radius: 5px;
  color: white;
  font-size: 1rem;
  width: 100%;
  box-sizing: border-box; /* Ensure padding doesn't affect width */
  caret-color: #fff; /* Ensure cursor is visible */
  position: relative; /* Ensure no z-index issues */
  z-index: 1; /* Ensure input is above other elements */
}

input::placeholder {
  color: #A0A0A0;
}

input[type="text"]:focus,
input[type="password"]:focus {
  outline: none;
  border: 1px solid #28A745;
  box-shadow: 0 0 5px rgba(40, 167, 69, 0.5);
  background-color: #3A4B5C; /* Ensure background doesn't change on focus */
}

button {
  background-color: #6C757D;
  color: white;
  padding: 8px 16px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1rem;
  transition: background-color 0.2s ease;
}

button:hover {
  background-color: #5A6268;
}

button:active {
  transform: scale(0.96);
}

.error {
  background-color: #DC3545;
  color: white;
  padding: 10px;
  border-radius: 5px;
  margin-bottom: 20px;
  text-align: center;
  font-weight: bold;
}
</style>
</head>
<body>
    <div class="container">
        <h1>Super Admin Login</h1>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
