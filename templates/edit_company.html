<h2>Edit Company</h2>
<form method="POST">
    <label>Company Name:</label><br>
    <input type="text" name="company_name" value="{{ company[1] }}" required><br><br>

    <label>Username:</label><br>
    <input type="text" name="company_username" value="{{ company[2] }}" required><br><br>

    <label>Password:</label><br>
    <input type="text" name="company_password" value="{{ company[3] }}" required><br><br>

    <button type="submit">Save Changes</button>
</form>
